[workspace]
members = ["crates/*"]
resolver = "2"

# One version for every crate; a release tag v<version> must match it.
[workspace.package]
version = "0.1.0"

# Distribution build. Unwinding panics stay on: per-file and worker panics are caught
# (catch_unwind) and must never take the whole app down, so no `panic = "abort"`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
