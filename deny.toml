# cargo-deny configuration: `cargo deny check` (licences and advisories).
# Only permissive licences are allowed. A crate offered under several licences
# (for example "Apache-2.0 OR GPL-2.0-only") passes when one of them is allowed;
# nit takes the permissive option.

[graph]
all-features = false

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]

[advisories]
version = 2
ignore = [
    # bincode 1.3.3 is flagged as unmaintained (its authors consider it complete). It is
    # only a transitive dependency of syntect (via two-face), and no syntect release
    # drops it, so there is nothing to upgrade to. Revisit when syntect moves off it.
    { id = "RUSTSEC-2025-0141", reason = "unmaintained, transitive via syntect; no fix available, revisit" },
]
